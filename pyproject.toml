[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swordholder"
version = "0.10.0"
description = "缁?AI 缁撹鐩栫珷锛氭妸鍛婅鍒嗚瘖缁撹灏佹垚鍙绾跨嫭绔嬮獙绛剧殑 ed25519 鍑瘉锛屽彲鎺ュ叆 SOC / SOAR / MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ma Ziyao" }]
keywords = ["ai-security", "ed25519", "audit", "soc", "triage", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=42.0.0",
  "pyyaml>=6.0.1,<7",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "coverage[toml]>=7.4", "ruff>=0.5"]

[project.scripts]
swordholder = "swordholder.cli:main"

[project.urls]
Homepage = "https://github.com/mzymazy/swordholder"
Source = "https://github.com/mzymazy/swordholder"

[tool.setuptools]
packages = ["swordholder", "mcp_server"]

[tool.setuptools.package-data]
swordholder = ["samples/*.json", "alert.schema.json", "seal.schema.json", "policy/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:swordholder.*"]

[tool.coverage.run]
source = ["swordholder", "mcp_server"]
branch = true

[tool.coverage.report]
# 璐ㄩ噺闂ㄧ锛氭€昏鐩栫巼浣庝簬 85% 灏辫 pytest 閫€鍑虹爜闈?0锛孋I 闅忎箣涓柇銆?
# 闂ㄦ鍙?85 鑰岄潪褰撳墠瀹炴祴鍊硷紝鏄负浜嗙暀鍑洪噸鏋勪綑閲忓張闃叉鏃犲０涓嬫粦銆?
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["proofs/legacy_v0.4", "dist", "build", "evidence"]

[tool.ruff.lint]
# 鍙紑"鐪熼敊璇?绾ц鍒欙細璇硶/鏈畾涔夊悕/鏈敤瀵煎叆/琛岄暱銆?
# 涓嶈拷姹備竴娆℃€ф妸鍘嗗彶椋庢牸鍊烘竻闆讹紝閬垮厤闂ㄧ闀挎湡绾㈢潃澶卞幓鎰忎箟銆?
select = ["E4", "E7", "E9", "F", "E501"]

