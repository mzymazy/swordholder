name: mcp-selftest

on:
  push:
    paths:
      - "mcp_server/**"
      - "swordholder/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/mcp-selftest.yml"
  pull_request:
    paths:
      - "mcp_server/**"
      - "swordholder/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:
  # 每周一 03:00 UTC 全平台巡检（含 macOS 档）
  schedule:
    - cron: "0 3 * * 1"

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps: &selftest_steps
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install package (editable) + pytest
        run: pip install -e . pytest

      - name: Unit tests (seal / verify / triage / fail-closed)
        run: python -m pytest -q

      - name: CLI smoke test outside the repo (installed entrypoint)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          swordholder --version
          swordholder demo --out "$tmp/out" --keys "$tmp/keys"

      - name: MCP server selftest
        run: python mcp_server/selftest.py

      - name: End-to-end triage demo (seal + tamper detection)
        run: python agent/demo.py

      - name: Proof verification still green
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          n=0
          for f in proofs/*.yaml; do
            python verify_proof.py "$f" --trusted-keys trusted_keys.json --max-age-days 365 | grep -q -- "-> VALID$"
            n=$((n+1))
          done
          test "$n" -eq 4

  # macOS 单独一档，只在每周定时巡检与手动触发时调度：
  # GitHub 的 macOS runner 排队拥挤，常在数十分钟后被平台取消（steps=0），
  # 会把整条 run 判成 failure 造成假红。日常 push / PR 不再等 macOS 绿标。
  selftest-macos:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: macos-latest
    steps: *selftest_steps
