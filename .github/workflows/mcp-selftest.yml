name: mcp-selftest

on:
  push:
    paths:
      - "mcp_server/**"
      - "swordholder/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/mcp-selftest.yml"
  pull_request:
    paths:
      - "mcp_server/**"
      - "swordholder/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install package (editable) + pytest
        run: pip install -e . pytest

      - name: Unit tests (seal / verify / triage / fail-closed)
        run: python -m pytest -q

      - name: CLI smoke test outside the repo (installed entrypoint)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          swordholder --version
          swordholder demo --out "$tmp/out" --keys "$tmp/keys"

      - name: MCP server selftest
        run: python mcp_server/selftest.py

      - name: End-to-end triage demo (seal + tamper detection)
        run: python agent/demo.py

      - name: Proof verification still green
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          n=0
          for f in proofs/*.yaml; do
            python verify_proof.py "$f" --trusted-keys trusted_keys.json --max-age-days 365 | grep -q -- "-> VALID$"
            n=$((n+1))
          done
          test "$n" -eq 4
