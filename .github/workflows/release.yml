name: release

# 只在推送形如 v0.7.2 的 tag 时触发；日常 push 不会跑到发布逻辑。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # PyPI Trusted Publishing（OIDC）需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and sdist
        run: python scripts/build_release.py
      - name: Verify release (hashes, version, package data, examples)
        run: python scripts/verify_release.py --write-sums
      - name: Twine metadata check
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # 环境名在 PyPI 侧配置 Trusted Publisher 时必须与之匹配；未配置则本 job 提交失败，
    # 这正是我们希望的 fail-closed 行为——没有登记过的发布者不能上传。
    environment:
      name: pypi
      url: https://pypi.org/p/swordholder
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
