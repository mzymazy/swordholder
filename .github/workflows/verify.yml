name: verify

on:
  push:
  pull_request:

jobs:
  verify-proofs:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 验证器对抗自测 v0.5（17 用例）：脚本在临时目录内构造全部用例，使用独立测试信任锚。
      # 合法 ed25519 → VALID；伪造签名 / 篡改证据 / 篡改绑定工件 / 换公钥 / 算法降级 /
      # 真实过期（400 天） / 无信任锚 / 重复顶层键（含引号键与流式映射） / 时间戳非法 / 未来时间
      # → 全部拒绝且原因码正确。脚本退出码 0 = 17/17 符合预期。
      - name: 验证器对抗自测（17 用例）
        run: |
          set -euo pipefail
          python evidence/adversarial_verifier_test.py
          python - <<'PY'
          import json
          d = json.load(open("evidence/adversarial_verifier_test_v05.json", encoding="utf-8"))
          assert d["verifier_version"] == "v0.5", d["verifier_version"]
          assert d["all_passed"] is True, d
          assert d["case_count"] == 17 and d["passed_count"] == 17, (d["case_count"], d["passed_count"])
          print("验证器对抗自测：%d/%d 通过" % (d["passed_count"], d["case_count"]))
          PY

      # 对 proofs/ 下既存 4 份威慑凭证逐一执行 verify_proof.py 自检并硬性断言 VALID
      # 说明：4 份凭证均由信任锚 k-ed25519-001 签发，实测全部 VALID；此处设硬性 VALID 门槛，失败即 CI 红。
      - name: proofs 凭证自检
        run: |
          set -euo pipefail
          n=0
          for f in proofs/*.yaml; do
            echo "== $f =="
            python verify_proof.py "$f" --trusted-keys trusted_keys.json --max-age-days 365 | grep -q -- "-> VALID$"
            n=$((n+1))
          done
          if [ "$n" -ne 4 ]; then echo "期望 4 份凭证，实际 $n 份"; exit 1; fi
          echo "proofs 凭证自检：4/4 全部 VALID"

      # 口径一致性守卫：权威四态数字与验证器版本不得回退（防止文档再次自相矛盾）
      - name: 口径一致性守卫
        run: |
          set -euo pipefail
          grep -q "semantic-v2.2" README.md
          grep -q "baseline 30/47" README.md
          grep -q "45/47" README.md
          if grep -rq -- "v0.4" README.md deliverable/README-reviewer.md deliverable/README-oss.md; then
            echo "文档回退到 v0.4 口径"; exit 1
          fi
          if grep -rqE -- "对抗自测：1[0]/10" .github README.md deliverable/ 2>/dev/null; then
            echo "文档回退到 10 用例口径"; exit 1
          fi
          echo "口径一致性守卫：通过"

      # 评测记录 ↔ 原始响应工件 绑定审计（v9 新增第三步之外的第 4 步）：
      # 对承载原始响应的 482 条逐题记录做 T1 文本哈希 / T2 工件字节哈希 / T3 内容包含 三重核验，
      # 任一不成立即 CI 红。聚合统计记录（无逐题响应）单列为 structured_only，不计入分母。
      - name: 评测记录↔工件绑定审计（三重核验）
        run: |
          set -euo pipefail
          python evidence/verify_artifact_binding.py
          python - <<'PY'
          import json
          d = json.load(open("evidence/artifact_binding_audit.json", encoding="utf-8"))
          assert d["all_bound_scope_A"] is True, "存在未绑定记录"
          assert d["all_content_consistent"] is True, "存在工件内容与响应不一致"
          assert d["not_bound_count"] == 0, d["not_bound_count"]
          assert d["T1_response_text_hash_ok"] == d["T2_artifact_bytes_hash_ok"] == d["T3_content_contains_response_ok"]
          print("绑定审计：%d/%d 三重核验通过（T1/T2/T3 各 %d）" % (
              d["bound_total"], d["records_with_response"], d["T1_response_text_hash_ok"]))
          PY

  # 打包件冒烟：证明"pip 装上就能用"，覆盖三平台 × 两 Python 版本。
  # 只跑 CPU 可完成的部分（归一 → 分诊 → 盖章 → 验签 → 索引 → HTTP），不需要 GPU / 模型 / 联网。
  package-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 以包的形式安装（pip install -e .）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: 单元与集成测试（核心 / 归一 / HTTP / CLI 契约）
        run: python -m pytest -q

      - name: CLI + HTTP 端到端冒烟
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          swordholder --version
          swordholder keygen --out "$work/keys" > /dev/null

          cat > "$work/alert.json" <<'JSON'
          {
            "alert_id": "CI-SMOKE-0001",
            "title": "CI runner outbound to unregistered ASN",
            "asset": "build-runner-09",
            "severity": "high",
            "signal": "CI pipeline token reused from unexpected ASN",
            "tags": ["CredentialAccess"]
          }
          JSON

          swordholder triage "$work/alert.json" --seal \
            -k "$work/keys/swordholder_ed25519_private.pem" --db "$work/index.db" > "$work/out.json"

          python - "$work/out.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert d["verdict"] in {"true_positive", "suspicious", "false_positive"}, d
          assert d["payload_sha256"] and d["seal"], d
          assert d["indexed"] is True, d
          print("triage ok:", d["alert_id"], d["verdict"], d["severity"])
          PY

          swordholder query --db "$work/index.db" --limit 5

          # 信任治理冒烟：轮换后历史凭证仍 VALID，停用后旧钥签新凭证被拒，吊销即时生效
          seal=$(python -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))['seal'])" "$work/out.json")
          trustf="$work/trusted.json"
          swordholder trust add --keys-file "$trustf" --key-id k-ci-a \
            --pubkey-file "$work/keys/swordholder_ed25519_public.pem" > /dev/null
          swordholder verify "$seal" --keys "$trustf" > "$work/v1.json"

          swordholder keygen --out "$work/keys2" > /dev/null
          swordholder trust add --keys-file "$trustf" --key-id k-ci-b \
            --pubkey-file "$work/keys2/swordholder_ed25519_public.pem" > /dev/null
          swordholder trust retire k-ci-a --keys-file "$trustf" --replaced-by k-ci-b > /dev/null
          swordholder verify "$seal" --keys "$trustf" > "$work/v2.json"

          swordholder trust revoke "$seal" --seal --keys-file "$trustf" --reason ci-smoke > /dev/null
          swordholder verify "$seal" --keys "$trustf" > "$work/v3.json" || true
          swordholder trust show --keys-file "$trustf" --json > "$work/trust.json"

          python - "$work/v1.json" "$work/v2.json" "$work/v3.json" "$work/trust.json" <<'PY'
          import json, sys
          v1, v2, v3, tr = (json.load(open(p, encoding="utf-8")) for p in sys.argv[1:5])
          assert v1["verdict"] == "VALID" and v1["key_status"] == "active", v1
          assert v2["verdict"] == "VALID" and v2["key_status"] == "retired", v2
          assert v3["verdict"] == "INVALID" and v3["reason"] == "E_SEAL_REVOKED", v3
          assert tr["counts"]["total"] == 2 and tr["revoked_seal_count"] == 1, tr
          print("trust ok: 轮换后历史凭证 %s 仍 VALID；吊销后 -> %s" % (v2["key_status"], v3["reason"]))
          PY

          # HTTP 服务：起在回环端口，探活 + 一次分诊调用
          swordholder serve --port 18081 -k "$work/keys/swordholder_ed25519_private.pem" \
            --out "$work/seals" --db "$work/index.db" > "$work/serve.log" 2>&1 &
          serve_pid=$!
          trap 'kill $serve_pid 2>/dev/null || true' EXIT

          python - "$work/alert.json" <<'PY'
          import json, sys, time, urllib.request
          url = "http://127.0.0.1:18081"
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url + "/healthz", timeout=2) as r:
                      health = json.loads(r.read())
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("服务未在 10 秒内就绪")
          assert health["ok"] is True and health["sealing"] is True, health

          payload = open(sys.argv[1], encoding="utf-8").read().encode("utf-8")
          req = urllib.request.Request(url + "/v1/triage?seal=1", data=payload,
                                       headers={"Content-Type": "application/json"})
          body = json.loads(urllib.request.urlopen(req, timeout=10).read())
          assert body["triage"]["verdict"], body
          assert body["verification"]["verdict"] == "VALID_UNTRUSTED_KEY", body["verification"]
          print("http ok:", body["triage"]["verdict"], body["verification"]["verdict"])
          PY
