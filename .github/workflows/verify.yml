name: verify

on:
  push:
  pull_request:
  # 全平台巡检：macOS 档只在定时与手动触发时调度（见 package-smoke-macos），
  # 日常 push / PR 不再为排队中的 macOS runner 等绿标。
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  verify-proofs:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -e . pytest

      # 验证器对抗自测 v0.5（17 用例）：脚本在临时目录内构造全部用例，使用独立测试信任锚。
      # 合法 ed25519 → VALID；伪造签名 / 篡改证据 / 篡改绑定工件 / 换公钥 / 算法降级 /
      # 真实过期（400 天） / 无信任锚 / 重复顶层键（含引号键与流式映射） / 时间戳非法 / 未来时间
      # → 全部拒绝且原因码正确。脚本退出码 0 = 17/17 符合预期。
      - name: 验证器对抗自测（17 用例）
        run: |
          set -euo pipefail
          python evidence/adversarial_verifier_test.py
          python - <<'PY'
          import json
          d = json.load(open("evidence/adversarial_verifier_test_v05.json", encoding="utf-8"))
          assert d["verifier_version"] == "v0.5", d["verifier_version"]
          assert d["all_passed"] is True, d
          assert d["case_count"] == 17 and d["passed_count"] == 17, (d["case_count"], d["passed_count"])
          print("验证器对抗自测：%d/%d 通过" % (d["passed_count"], d["case_count"]))
          PY

      # 对 proofs/ 下既存 4 份威慑凭证逐一执行 verify_proof.py 自检并硬性断言 VALID
      # 说明：4 份凭证均由信任锚 k-ed25519-001 签发，实测全部 VALID；此处设硬性 VALID 门槛，失败即 CI 红。
      - name: proofs 凭证自检
        run: |
          set -euo pipefail
          n=0
          for f in proofs/*.yaml; do
            echo "== $f =="
            python verify_proof.py "$f" --trusted-keys trusted_keys.json --max-age-days 365 | grep -q -- "-> VALID$"
            n=$((n+1))
          done
          if [ "$n" -ne 4 ]; then echo "期望 4 份凭证，实际 $n 份"; exit 1; fi
          echo "proofs 凭证自检：4/4 全部 VALID"

      # 口径一致性守卫：权威四态数字与验证器版本不得回退（防止文档再次自相矛盾）
      - name: 口径一致性守卫
        run: |
          set -euo pipefail
          grep -q "semantic-v2.2" README.md
          grep -q "baseline 30/47" README.md
          grep -q "45/47" README.md
          # 测试数必须与 README 声称一致（曾出现文档写 61 passed、实际 85 passed 的漂移）
          # 不再写死数字：实际用例数由 pytest 现算（按 tests/*.py: N 逐文件求和，不依赖 pytest 汇总行），
          # README 必须与之一致，从根上消除二次漂移。
          ACTUAL=$(python -m pytest --collect-only -q 2>/dev/null | awk -F': ' '/^[^ ]+\.py: [0-9]+$/ {s+=$2} END {print s+0}')
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" = "0" ]; then echo "无法从 pytest 取到用例数"; exit 1; fi
          grep -q "$ACTUAL passed" README.md || { echo "README 的 pytest 数字与实际的 $ACTUAL 不符"; exit 1; }
          echo "测试数口径一致：$ACTUAL passed"
          if grep -rq -- "v0.4" README.md deliverable/README-reviewer.md deliverable/README-oss.md; then
            echo "文档回退到 v0.4 口径"; exit 1
          fi
          if grep -rqE -- "对抗自测：1[0]/10" .github README.md deliverable/ 2>/dev/null; then
            echo "文档回退到 10 用例口径"; exit 1
          fi
          echo "口径一致性守卫：通过"

      # AIGC 隐式标识守卫：对外文档头的 7 个字段必须齐全，ReservedCode 必须可 base64
      # 解码为 140 字节。删除/折行/改用 YAML 锚点都会让只做正则会话的解析器读不到水印，
      # 因此这里设硬性门槛；见 docs/aigc-disclosure.md。
      - name: AIGC 标识头一致性守卫
        run: python scripts/check_aigc_headers.py

      # 策略变更门禁：判定规则已外置到 swordholder/policy/*.yaml，改一份 YAML 就等于改系统行为。
      # cases/ 下 6 条人工签名判据案例覆盖"该放行"与"该拒收"两侧，必须全部符合期望；
      # 案例被改动而 cases/manifest.json 未同步更新 -> 退出码 2，直接红灯，
      # 防止"顺手把不听话的案例改掉"。见 docs/policy.md、cases/README.md。
      - name: 策略变更门禁（6 条判据案例）
        run: |
          set -euo pipefail
          python scripts/regress_policy.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import regress_policy as rp
          cases = rp.load_cases()
          assert len(cases) == 6, "判据案例数变了：%d" % len(cases)
          print("策略门禁：%d/%d 判据案例通过（含该放行与该拒收两侧）" % (len(cases), len(cases)))
          PY

      # 评测记录 ↔ 原始响应工件 绑定审计（v9 新增第三步之外的第 4 步）：
      # 对承载原始响应的 482 条逐题记录做 T1 文本哈希 / T2 工件字节哈希 / T3 内容包含 三重核验，
      # 任一不成立即 CI 红。聚合统计记录（无逐题响应）单列为 structured_only，不计入分母。
      - name: 评测记录↔工件绑定审计（三重核验）
        run: |
          set -euo pipefail
          python evidence/verify_artifact_binding.py
          python - <<'PY'
          import json
          d = json.load(open("evidence/artifact_binding_audit.json", encoding="utf-8"))
          assert d["all_bound_scope_A"] is True, "存在未绑定记录"
          assert d["all_content_consistent"] is True, "存在工件内容与响应不一致"
          assert d["not_bound_count"] == 0, d["not_bound_count"]
          assert d["T1_response_text_hash_ok"] == d["T2_artifact_bytes_hash_ok"] == d["T3_content_contains_response_ok"]
          print("绑定审计：%d/%d 三重核验通过（T1/T2/T3 各 %d）" % (
              d["bound_total"], d["records_with_response"], d["T1_response_text_hash_ok"]))
          PY

  # 出口完整性门禁：reference monitor 的 always invoked 前提必须可被证伪。
  # tests/test_exit_integrity.py 27 用例分四组：A 枚举完整性（AST 扫真实入口与 EXITS 双向比对）
  # / B 绕过注入 11 条（解释合理但证据不足、改严重性、越权改信任锚、票据串用等）/
  # C 出口清偿（HTTP、MCP、CLI、Agent 各跑真链路，响应必须带 judgment）/ D 签发通道唯一。
  # 任何一条红都意味着"结论存在不经判定的路径"，判定级授权失去成立前提 —— 阻断级失败。
  exit-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -e . pytest

      - name: 出口完整性四组断言（枚举 / 绕过注入 / 清偿 / 签发唯一）
        run: python -m pytest -q tests/test_exit_integrity.py

      - name: 出口自检（每个必判出口真判一次，覆盖率必须 1.0）
        run: |
          set -euo pipefail
          swordholder exits --selftest > /tmp/exits.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/exits.json", encoding="utf-8"))
          assert d["ok"] is True, d.get("failed")
          assert d["coverage"] == 1.0, d["coverage"]
          assert not d["unjudged"], d["unjudged"]
          print("出口自检：%d/%d 必判出口全部取到票据（登记出口 %d）"
                % (len(d["covered"]), len(d["mandatory"]), d["exits_total"]))
          PY

  # 打包件冒烟：Linux + Windows × 三个 Python 版本，每次 push / PR 全跑。
  # 步骤实现见 package-smoke.yml（workflow_call），三平台共用一份，避免抄三遍走样。
  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    uses: ./.github/workflows/package-smoke.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}

  # macOS 单独一档，只在定时巡检（每周一 03:00 UTC）与手动触发时调度：
  # GitHub 的 macOS runner 排队拥挤，常等数十分钟后被平台取消（steps=0），
  # 既拖慢绿标又制造假红。平台覆盖不减，只是不在每次 push 上消耗队列。
  package-smoke-macos:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/package-smoke.yml
    with:
      os: macos-latest
      python-version: "3.12"
      non_blocking: true
